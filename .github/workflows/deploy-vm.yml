# Every push to main goes live on the Oracle VM (deploy/deploy.sh), the way
# Vercel and Render used to pick it up. Needs three repository secrets:
#   VM_HOST     the VM's public IP
#   VM_USER     ubuntu
#   VM_SSH_KEY  the private key the VM accepts (the one Oracle made at creation)
name: Deploy to VM

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.VM_DEPLOY == 'on' }}
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 20m
          script: bash /opt/settle/deploy/deploy.sh
