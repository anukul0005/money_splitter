services:
  - type: web
    name: money-splitter-api
    runtime: python
    rootDir: ./backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false          # e.g. https://your-app.vercel.app
      # Signs session tokens. Render's disk is ephemeral, so the on-disk
      # fallback key is regenerated on every restart — and a free instance
      # restarts whenever it spins down after idling, which signed everyone
      # out at apparently random times. generateValue makes Render mint this
      # once and keep it, so sessions survive restarts and redeploys.
      - key: SECRET_KEY
        generateValue: true
      # Email. Without these the app starts fine and simply sends nothing —
      # login codes and group notifications are silently skipped — so they
      # are declared here to make their absence visible in the dashboard
      # rather than something you find out about from a missing email.
      # SMTP_APP_PASSWORD is a 16-character Google App Password, not the
      # account password; paste it without the spaces Google displays.
      - key: SMTP_SENDER
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      # Used to build the links inside notification emails; without it they
      # point at localhost.
      - key: FRONTEND_URL
        sync: false
