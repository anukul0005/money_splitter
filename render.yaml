services:
  - type: web
    name: money-splitter-api
    runtime: python
    rootDir: ./backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false          # e.g. https://your-app.vercel.app
      # Signs session tokens. Render's disk is ephemeral, so the on-disk
      # fallback key is regenerated on every restart — and a free instance
      # restarts whenever it spins down after idling, which signed everyone
      # out at apparently random times. generateValue makes Render mint this
      # once and keep it, so sessions survive restarts and redeploys.
      - key: SECRET_KEY
        generateValue: true
      # Email. Without these the app starts fine and simply sends nothing —
      # login codes and group notifications are silently skipped — so they
      # are declared here to make their absence visible in the dashboard
      # rather than something you find out about from a missing email.
      # SMTP_APP_PASSWORD is a 16-character Google App Password, not the
      # account password; paste it without the spaces Google displays.
      - key: SMTP_SENDER
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      # The transport that actually works here. Render drops outbound SMTP
      # on both 465 and 587 - they time out rather than being refused - so
      # mail leaves over HTTPS instead. SMTP_SENDER is still required
      # alongside this: it is the From address for both transports, and must
      # be verified as a sender in Brevo or every send is rejected.
      - key: BREVO_API_KEY
        sync: false
      # Used to build the links inside notification emails; without it they
      # point at localhost.
      - key: FRONTEND_URL
        sync: false
      # Shared secret for GET /cron/daily (birthday emails) - an external
      # cron pinger (e.g. cron-job.org) calls that URL with ?key=<this> once
      # a day. Left unset, the endpoint refuses every request rather than
      # being open by default; generateValue means Render mints one for you,
      # which you then copy into the pinger's URL.
      - key: CRON_SECRET
        generateValue: true
      # Receipt OCR (routers/receipts.py) - all three optional and
      # independent. Leaving one blank just skips that provider; the app
      # runs fine with none set, it just can't scan a receipt yet.
      - key: OCRSPACE_API_KEY
        sync: false
      - key: AZURE_VISION_KEY
        sync: false
      - key: AZURE_VISION_ENDPOINT
        sync: false
      - key: GOOGLE_VISION_API_KEY
        sync: false
      # Structured extraction of a scanned receipt's fields (GPT-OSS-120B
      # via Groq) - optional; the app falls back to a regex-based
      # extractor when this is blank.
      - key: GROQ_API_KEY
        sync: false
